# Litestream — continuous off-disk replication of the single SQLite application
# database to Cloudflare R2. Disaster recovery: a disk loss becomes "restore from
# R2" instead of data loss.
#
# Everything account-specific is read from the ENVIRONMENT, never stored here
# (Litestream expands ${VAR} when it loads this file):
#   LITESTREAM_ACCESS_KEY_ID      R2 API token Access Key ID
#   LITESTREAM_SECRET_ACCESS_KEY  R2 API token Secret Access Key
#   R2_ACCOUNT_ENDPOINT           account-level R2 host, shared with the renders bucket
#   LITESTREAM_BUCKET             backup bucket; scripts/start.sh defaults it to stagify-backups
# Set the keys and endpoint in your local .env and in the Render dashboard. If any is
# unset, start.sh skips replication and the app still runs normally.
dbs:
  - path: /data/auth-store.db          # Render persistent-disk path (./data locally)
    replicas:
      - type: s3
        bucket: ${LITESTREAM_BUCKET}
        path: auth-store               # key prefix inside the bucket
        endpoint: ${R2_ACCOUNT_ENDPOINT}
        region: auto                   # R2 uses "auto"
